# Example only: replace host/certificate paths and apply an ingress allowlist
# appropriate to the operator. Keep Vespera bound to loopback.
server {
    listen 443 ssl;
    server_name vespera.example.invalid;

    ssl_certificate     /etc/letsencrypt/live/vespera.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vespera.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Add explicit allow/deny rules for trusted desktop egress addresses.
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
        client_max_body_size 18m;
    }
}
