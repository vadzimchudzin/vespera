name: release

on:
  push:
    tags:
      - "v*"
    branches:
      - "hoplite/kranioi-92ea492d--operations-safety--setups--research--ai"
    paths:
      - ".github/release-request.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: version
        name: Validate exact release version
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = require('./package.json');
          const lock = require('./package-lock.json');
          if (!/^\d+\.\d+\.\d+$/.test(p.version)) throw Error('invalid_version');
          if (lock.version !== p.version || lock.packages[''].version !== p.version) throw Error('lock_version_mismatch');
          if (process.env.GITHUB_REF.startsWith('refs/tags/') && process.env.GITHUB_REF !== `refs/tags/v${p.version}`) throw Error('tag_version_mismatch');
          if (!process.env.GITHUB_REF.startsWith('refs/tags/')) {
            const request = require('./.github/release-request.json');
            if (request.version !== p.version) throw Error('request_version_mismatch');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${p.version}\ntag=v${p.version}\n`);
          NODE

  test:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  prepare:
    needs: [validate, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - id: draft
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100});
            const existing = releases.find(r => r.tag_name === tag);
            if (existing && (!existing.draft || existing.target_commitish !== context.sha)) throw new Error('Release already exists for another commit or is published');
            const release = existing || (await github.rest.repos.createRelease({...context.repo, tag_name: tag, target_commitish: context.sha, name: `Vespera ${tag.slice(1)}`, draft: true, body: 'Build verification in progress; not approved for distribution.'})).data;
            core.setOutput('release_id', String(release.id));

  build:
    needs: [validate, test, prepare]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            script: dist:win
            glob: dist/*.exe
          - os: macos-latest
            platform: mac
            script: dist:mac
            glob: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - name: Verify macOS app signature and architectures
        if: runner.os == 'macOS'
        run: |
          APP="$(ls -d dist/mac-universal/*.app)"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -q "Signature=adhoc"
          BIN="$APP/Contents/MacOS/$(basename "$APP" .app)"
          ARCHS="$(lipo -archs "$BIN")"; echo "archs: $ARCHS"
          echo "$ARCHS" | grep -qw x86_64 && echo "$ARCHS" | grep -qw arm64
      - name: Upload verified installer to private draft release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          VERSION: ${{ needs.validate.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const release_id = Number(process.env.RELEASE_ID);
            const name = process.env.PLATFORM === 'win' ? `Vespera-${process.env.VERSION}-win-x64.exe` : `Vespera-${process.env.VERSION}-mac.dmg`;
            const data = fs.readFileSync(`dist/${name}`);
            if (!data.length) throw new Error('Empty installer');
            const digest = crypto.createHash('sha256').update(data).digest('hex');
            const release = (await github.rest.repos.getRelease({...context.repo, release_id})).data;
            if (!release.draft || release.target_commitish !== context.sha) throw new Error('Draft ownership mismatch');
            for (const [filename, body] of [[name, data], [name + '.sha256', Buffer.from(`${digest}  ${name}\n`)]]) {
              await github.rest.repos.uploadReleaseAsset({...context.repo, release_id, name: filename, data: body, headers: {'content-type': 'application/octet-stream', 'content-length': body.length}});
            }

  publish:
    needs: [validate, test, prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify both uploaded installers and publish
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          VERSION: ${{ needs.validate.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const release_id = Number(process.env.RELEASE_ID);
            const release = (await github.rest.repos.getRelease({...context.repo, release_id})).data;
            if (!release.draft || release.target_commitish !== context.sha) throw new Error('Draft ownership mismatch');
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {...context.repo, release_id, per_page: 100});
            async function download(asset) {
              const response = await fetch(asset.url, {headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/octet-stream', 'X-GitHub-Api-Version': '2022-11-28'}});
              if (!response.ok) throw new Error(`Asset download failed: ${response.status}`);
              return Buffer.from(await response.arrayBuffer());
            }
            const sums = [];
            for (const name of [`Vespera-${process.env.VERSION}-win-x64.exe`, `Vespera-${process.env.VERSION}-mac.dmg`]) {
              const asset = assets.find(a => a.name === name);
              const checksum = assets.find(a => a.name === name + '.sha256');
              if (!asset || !checksum || asset.size <= 0) throw new Error(`Missing verified installer: ${name}`);
              const binary = await download(asset);
              const expected = (await download(checksum)).toString('utf8').trim();
              const actual = crypto.createHash('sha256').update(binary).digest('hex');
              if (expected !== `${actual}  ${name}` || binary.length !== asset.size) throw new Error(`Installer checksum mismatch: ${name}`);
              sums.push(expected);
            }
            const data = Buffer.from(sums.join('\n') + '\n');
            await github.rest.repos.uploadReleaseAsset({...context.repo, release_id, name: 'SHA256SUMS.txt', data, headers: {'content-type': 'text/plain', 'content-length': data.length}});
            await github.rest.repos.updateRelease({...context.repo, release_id, draft: false, body: fs.readFileSync('docs/RELEASE_VERIFICATION.md', 'utf8'), make_latest: 'true'});
