name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label (e.g. 0.1.0)"
        required: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            glob: dist/*.exe
          - os: macos-latest
            script: dist:mac
            glob: dist/*.dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run ${{ matrix.script }}
      - name: Verify macOS app (signature + architectures)
        if: runner.os == 'macOS'
        run: |
          APP="$(ls -d dist/mac-universal/*.app)"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -q "Signature=adhoc"
          BIN="$APP/Contents/MacOS/$(basename "$APP" .app)"
          ARCHS="$(lipo -archs "$BIN")"; echo "archs: $ARCHS"
          echo "$ARCHS" | grep -qw x86_64 && echo "$ARCHS" | grep -qw arm64
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: ${{ matrix.glob }}
