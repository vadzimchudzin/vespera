<!DOCTYPE html>
<html lang="en" data-theme="glass-dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.binance.com https://api.binance.us wss://data-stream.binance.vision wss://stream.binance.com:443 wss://stream.binance.us:9443 wss://stream.binance.com:9443;"
    />
    <title>Vespera</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <div class="app">
      <header class="chrome drag">
        <div class="chrome-left no-drag">
          <div class="brand">
            <img class="brand-mark" src="assets/icon.png" alt="" />
            <div class="brand-name" data-i18n="app">Vespera</div>
          </div>
          <div class="chrome-picks" id="chromePicks">
            <div class="hdr-slot" id="hdrSym"></div>
            <div class="hdr-slot" id="hdrTf"></div>
          </div>
        </div>
        <div class="chrome-center no-drag">
          <div class="seg" id="modeSeg">
            <button data-mode="paper" class="on" data-i18n="paper">Paper</button>
            <button data-mode="auto" data-i18n="auto">Auto</button>
          </div>
          <span class="money-badge" id="moneyBadge" tabindex="0" hidden><span class="mb-dot"></span><span class="mb-text"></span></span>
        </div>
        <div class="chrome-right no-drag">
          <span class="lamp" id="statusLamp" data-on="0" data-status="stopped" title="Idle"></span>
          <button class="cta" id="btnRun" data-i18n="start">Start</button>
          <button class="ghost-round" id="btnMenu" title="Menu">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <circle cx="6" cy="12" r="1.6" />
              <circle cx="12" cy="12" r="1.6" />
              <circle cx="18" cy="12" r="1.6" />
            </svg>
          </button>
          <div class="win-btns" id="winBtns">
            <button id="btnMin">–</button>
            <button id="btnMax">□</button>
            <button id="btnClose">×</button>
          </div>
        </div>
      </header>

      <main class="stage">
        <aside class="rail glass" id="rail">
          <button class="rail-item on" data-panel="chart">
            <span class="ico">⌂</span><span data-i18n="app">Vespera</span>
          </button>
          <button class="rail-item" data-panel="stats">
            <span class="ico">♡</span><span data-i18n="stats">Stats</span>
          </button>
          <button class="rail-item" data-panel="journal">
            <span class="ico">◎</span><span data-i18n="journal">Journal</span>
          </button>
          <button class="rail-item" data-panel="settings">
            <span class="ico">⚙</span><span data-i18n="settings">Settings</span>
          </button>
          <div class="rail-sep"></div>
          <div class="rail-label" data-i18n="strategies">Strategies</div>
          <div id="strategyList" class="strategy-list"></div>
        </aside>

        <section class="chart-wrap glass">
          <div class="chart-frame" id="tvHost">
            <div class="chart-legend">
              <span class="lg ma200">SMA200</span>
              <span class="lg ma20">SMA20</span>
              <span class="lg up">UP</span>
              <span class="lg down">DOWN</span>
            </div>
            <button class="live-btn" id="btnLive" hidden type="button">
              <span class="live-arrow">→</span>
              <span data-i18n="goLive">Last candle</span>
            </button>
            <div id="chart"></div>
          </div>
        </section>
      </main>

      <footer class="dock glass">
        <div class="stat">
          <span data-i18n="balance">Balance</span>
          <strong id="bal" class="bal">$1,000.00</strong>
        </div>
        <div class="stat">
          <span data-i18n="series">Series</span>
          <strong id="series">1/6 · $1</strong>
        </div>
        <div class="stat">
          <span data-i18n="today">Today</span>
          <strong id="pnl">$0.00</strong>
        </div>
        <div class="log" id="log"></div>
      </footer>
    </div>

    <div class="sheet-backdrop" id="backdrop" hidden></div>
    <aside class="sheet glass" id="sheet" hidden>
      <div class="sheet-top">
        <button class="icon-btn" data-open="api" title="API">▣</button>
        <button class="icon-btn" data-open="deposit" title="Deposit">↓</button>
        <button class="icon-btn" data-open="theme" title="Theme">▤</button>
        <button class="icon-btn" data-open="language" title="Language">文</button>
      </div>
      <button class="row" data-open="api">
        <span data-i18n="api">API</span><span class="row-ico">⌕</span>
      </button>
      <button class="row" data-open="deposit">
        <span data-i18n="deposit">Deposit</span><span class="row-ico">↓</span>
      </button>
      <button class="row" data-open="theme">
        <span data-i18n="theme">Theme</span><span class="row-ico">▤</span>
      </button>
      <button class="row" data-open="language">
        <span data-i18n="language">Language</span><span class="row-ico">文</span>
      </button>
      <button class="row danger" id="sheetClose">
        <span data-i18n="close">Close</span><span class="row-ico">✕</span>
      </button>
    </aside>

    <section class="panel glass" id="panel" hidden>
      <header class="panel-h">
        <h2 id="panelTitle">Settings</h2>
        <button class="orb sm" id="panelClose">✕</button>
      </header>
      <div id="panelBody"></div>
      <footer class="panel-foot" id="panelFoot" hidden></footer>
    </section>
    <div id="vspTip" hidden></div>

    <script src="vendor/lightweight-charts.js"></script>
    <script src="chart.js"></script>
    <script src="i18n.js"></script>
    <script src="../shared/settings.js"></script>
    <script src="app.js"></script>
  </body>
</html>
